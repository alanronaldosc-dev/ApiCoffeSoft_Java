name: CI – API Java

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-sonar:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      DB_URL: jdbc:postgresql://localhost:5432/testdb
      DB_USERNAME: testuser
      DB_PASSWORD: testpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: ci-test-secret-key-not-used-in-prod
      TRACCAR_EMAIL: test@test.com
      TRACCAR_PASSWORD: testpass

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: Build y tests con cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Análisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=alanronaldosc-dev_ApiCoffeSoft_Java
            -Dsonar.organization=alanronaldosc-dev
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Empaquetar JAR para deploy
        run: ./mvnw -B package -DskipTests
        if: github.ref == 'refs/heads/master'

      - name: Subir JAR al EC2
        uses: appleboy/scp-action@v0.1.7
        if: github.ref == 'refs/heads/master'
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ec2-user/"
          strip_components: 1

  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: build-test-sonar
    if: github.ref == 'refs/heads/master'
    env:
      DB_URL_PROD: ${{ secrets.DB_URL_PROD }}
      DB_USERNAME_PROD: ${{ secrets.DB_USERNAME_PROD }}
      DB_PASSWORD_PROD: ${{ secrets.DB_PASSWORD_PROD }}

    steps:
      - name: Reiniciar servicio en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL_PROD,DB_USERNAME_PROD,DB_PASSWORD_PROD
          script: |
            # Instalar Java 17 si no está
            if ! java -version 2>&1 | grep -q "17"; then
              sudo dnf install -y java-17-amazon-corretto-headless
            fi

            # Crear directorio si no existe
            sudo mkdir -p /opt/cafesoft-api
            sudo chown ec2-user:ec2-user /opt/cafesoft-api

            # Mover JAR desde home al directorio de la app
            mv /home/ec2-user/*.jar /opt/cafesoft-api/ 2>/dev/null || true

            # Crear archivo de variables de entorno
            sudo tee /opt/cafesoft-api/.env > /dev/null <<EOF
            DB_URL=$DB_URL_PROD
            DB_USERNAME=$DB_USERNAME_PROD
            DB_PASSWORD=$DB_PASSWORD_PROD
            EOF

            # Crear servicio systemd si no existe
            if [ ! -f /etc/systemd/system/cafesoft-api.service ]; then
              sudo tee /etc/systemd/system/cafesoft-api.service > /dev/null <<'SVCEOF'
            [Unit]
            Description=CafeSoft API
            After=network.target

            [Service]
            User=ec2-user
            WorkingDirectory=/opt/cafesoft-api
            EnvironmentFile=/opt/cafesoft-api/.env
            ExecStart=/usr/bin/java -jar /opt/cafesoft-api/ApiSpringCafeSoft-0.0.1-SNAPSHOT.jar
            SuccessExitStatus=143
            Restart=always
            RestartSec=10
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SVCEOF
              sudo systemctl daemon-reload
              sudo systemctl enable cafesoft-api
            else
              sudo systemctl daemon-reload
            fi

            # Reiniciar servicio con el nuevo JAR
            sudo systemctl restart cafesoft-api
            sleep 45

            # Health check con reintentos
            for i in 1 2 3 4 5; do
              if curl -f http://localhost:8080/api/health 2>/dev/null; then
                echo "Deploy exitoso - API en línea"
                exit 0
              fi
              echo "Intento $i fallido, esperando 15s..."
              sleep 15
            done
            echo "ERROR: API no respondió después de 120s"
            sudo journalctl -u cafesoft-api --no-pager -n 50
            exit 1
