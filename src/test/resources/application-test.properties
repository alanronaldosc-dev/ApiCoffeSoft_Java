# Base efimera exclusiva de pruebas; NO es PostgreSQL gestionado.
spring.datasource.url=jdbc:h2:mem:sprint3;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=solo-pruebas-clave-no-utilizar-en-produccion-123456789
app.cors.allowed-origins=https://web-prueba.example
app.security.public-registration=false
