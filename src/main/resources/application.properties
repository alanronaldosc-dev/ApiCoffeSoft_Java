
# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Cafesoft
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# 2. JPA / Hibernate
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración del servidor
server.port=8080


# ============================================
# 4. OpenAPI / Swagger
# ============================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false


# ============================================
# 5. Programa de fidelizacion
# ============================================

# HU-025 / HU-026
# 5 puntos equivalen a $1.00 MXN.
cafesoft.fidelizacion.puntos-por-peso=5


# ============================================
# 6. Integracion con Traccar
# ============================================
traccar.base-url=${TRACCAR_BASE_URL:}
traccar.email=${TRACCAR_EMAIL:}
traccar.password=${TRACCAR_PASSWORD:}
