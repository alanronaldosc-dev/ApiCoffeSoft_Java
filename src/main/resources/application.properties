
# ============================================
# CAFESOFT - CONFIGURACION DE LA API
# ============================================

# ============================================
# 1. PostgreSQL
# ============================================

# Base de datos configurable por entorno.
# Valor local predeterminado del proyecto principal.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafesoftbdpost}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:060204}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# 2. JPA / Hibernate
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ============================================
# 3. Servidor
# ============================================

server.port=8080


# ============================================
# 4. OpenAPI / Swagger
# ============================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false


# ============================================
# 5. Programa de fidelizacion
# ============================================

# HU-025 / HU-026
# 5 puntos equivalen a $1.00 MXN.
cafesoft.fidelizacion.puntos-por-peso=5


# ============================================
# 6. Integracion con Traccar
# ============================================

traccar.base-url=${TRACCAR_BASE_URL:http://localhost:8082}
traccar.email=${TRACCAR_EMAIL:admin@gmail.com}
traccar.password=${TRACCAR_PASSWORD:admin}


# ============================================
# 7. HU-035 / HU-036
# ============================================

# La segmentacion utiliza los servicios REST
# y la configuracion de seguridad existentes.
# No requiere nuevas propiedades obligatorias.


# ============================================
# 8. Notificaciones push (Expo Push Service)
# ============================================

# Permite desactivar el envio sin cambiar codigo.
app.notificaciones.enabled=${PUSH_ENABLED:true}

# Endpoint oficial de Expo para enviar notificaciones.
app.notificaciones.expo-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

# Canal de Android creado por la app movil.
app.notificaciones.channel-id=${EXPO_PUSH_CHANNEL:pedidos}

# Opcional: access token de Expo Push Security.
app.notificaciones.access-token=${EXPO_ACCESS_TOKEN:}
