# ============================================================
# Perfil H2 – base de datos en memoria para pruebas de carga
# Actívalo con:  -Dspring.profiles.active=h2
# ============================================================

# ── Datasource H2 ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cafesoftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Garantiza que JPA cree las tablas ANTES de que spring.sql.init las inserte
spring.jpa.defer-datasource-initialization=true

# ── Consola H2 (opcional, útil para inspeccionar tablas) ───
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Variables de entorno opcionales: defaults para H2 ──────
# Evita que Spring falle por variables no definidas
traccar.base-url=http://localhost:8082
traccar.email=noop@cafesoft.local
traccar.password=noop

# ── Datos iniciales de prueba ───────────────────────────────
spring.sql.init.mode=never
