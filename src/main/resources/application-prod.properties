# Produccion: no contiene credenciales ni valores de conexion fijos.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}&connectTimeout=5&socketTimeout=5
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# update conserva el comportamiento academico; usar validate tras adoptar migraciones.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# Solo ADMIN puede crear usuarios en produccion.
app.security.public-registration=false
